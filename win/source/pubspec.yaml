name: notebook_app
description: Кроссплатформенное приложение для заметок, задач и вопросов
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.2.0
  
  # HTTP client
  dio: ^5.4.3+1
  
  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Биометрическая аутентификация (вход по отпечатку на Android)
  local_auth: ^2.3.0

  # Проверка обновлений и установка нового APK поверх текущего (Android)
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # Utilities
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/avatars/
    - assets/icons/
