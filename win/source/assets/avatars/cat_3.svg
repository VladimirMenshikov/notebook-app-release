<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot Cat 3 - With headphones and smile -->
  <defs>
    <linearGradient id="body3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6BB6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A86FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Headphones band -->
  <path d="M 45 70 Q 100 20 155 70" stroke="#333" stroke-width="6" fill="none"/>
  
  <!-- Head -->
  <rect x="50" y="60" width="100" height="80" rx="20" fill="url(#body3)"/>
  
  <!-- Headphones -->
  <rect x="35" y="70" width="20" height="40" rx="10" fill="#333"/>
  <rect x="145" y="70" width="20" height="40" rx="10" fill="#333"/>
  
  <!-- Eyes -->
  <circle cx="75" cy="95" r="10" fill="white"/>
  <circle cx="125" cy="95" r="10" fill="white"/>
  <circle cx="75" cy="95" r="5" fill="#333"/>
  <circle cx="125" cy="95" r="5" fill="#333"/>
  
  <!-- Ears -->
  <polygon points="50,70 35,45 60,60" fill="#6BB6FF"/>
  <polygon points="150,70 165,45 140,60" fill="#6BB6FF"/>
  
  <!-- Big smile -->
  <path d="M 80 115 Q 100 130 120 115" stroke="white" stroke-width="3" fill="none"/>
  
  <!-- Body -->
  <rect x="60" y="140" width="80" height="50" rx="15" fill="url(#body3)"/>
  
  <!-- Arms -->
  <rect x="35" y="145" width="20" height="40" rx="10" fill="#6BB6FF"/>
  <rect x="145" y="145" width="20" height="40" rx="10" fill="#6BB6FF"/>
  
  <!-- Legs -->
  <rect x="75" y="185" width="15" height="15" rx="5" fill="#6BB6FF"/>
  <rect x="110" y="185" width="15" height="15" rx="5" fill="#6BB6FF"/>
</svg>
