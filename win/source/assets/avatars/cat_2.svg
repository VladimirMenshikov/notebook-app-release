<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot Cat 2 - With round glasses -->
  <defs>
    <linearGradient id="body2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E75B6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <rect x="50" y="50" width="100" height="80" rx="20" fill="url(#body2)"/>
  
  <!-- Glasses -->
  <circle cx="75" cy="85" r="18" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="125" cy="85" r="18" fill="none" stroke="#333" stroke-width="4"/>
  <line x1="93" y1="85" x2="107" y2="85" stroke="#333" stroke-width="4"/>
  
  <!-- Eyes (behind glasses) -->
  <circle cx="75" cy="85" r="8" fill="#333"/>
  <circle cx="125" cy="85" r="8" fill="#333"/>
  
  <!-- Ears -->
  <polygon points="50,60 35,30 60,50" fill="#5B9BD5"/>
  <polygon points="150,60 165,30 140,50" fill="#5B9BD5"/>
  
  <!-- Serious mouth -->
  <line x1="85" y1="110" x2="115" y2="110" stroke="white" stroke-width="3"/>
  
  <!-- Body -->
  <rect x="60" y="130" width="80" height="50" rx="15" fill="url(#body2)"/>
  
  <!-- Arms -->
  <rect x="35" y="135" width="20" height="40" rx="10" fill="#5B9BD5"/>
  <rect x="145" y="135" width="20" height="40" rx="10" fill="#5B9BD5"/>
  
  <!-- Legs -->
  <rect x="75" y="175" width="15" height="15" rx="5" fill="#5B9BD5"/>
  <rect x="110" y="175" width="15" height="15" rx="5" fill="#5B9BD5"/>
</svg>
