<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot Cat 5 - Sleeping on battery -->
  <defs>
    <linearGradient id="body5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7AB8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Battery -->
  <rect x="60" y="140" width="80" height="40" rx="8" fill="#FFD93D"/>
  <rect x="90" y="135" width="20" height="8" rx="4" fill="#FFD93D"/>
  <text x="100" y="165" text-anchor="middle" font-size="16" fill="#333">⚡</text>
  
  <!-- Head (resting on battery) -->
  <rect x="50" y="100" width="100" height="60" rx="20" fill="url(#body5)"/>
  
  <!-- Closed eyes (sleeping) -->
  <path d="M 65 125 Q 75 130 85 125" stroke="#333" stroke-width="3" fill="none"/>
  <path d="M 115 125 Q 125 130 135 125" stroke="#333" stroke-width="3" fill="none"/>
  
  <!-- Zzz -->
  <text x="155" y="110" font-size="14" fill="#666">Z</text>
  <text x="165" y="95" font-size="12" fill="#666">z</text>
  <text x="172" y="82" font-size="10" fill="#666">z</text>
  
  <!-- Ears -->
  <polygon points="50,110 35,90 55,100" fill="#7AB8FF"/>
  <polygon points="150,110 165,90 145,100" fill="#7AB8FF"/>
  
  <!-- Body (above battery) -->
  <rect x="60" y="60" width="80" height="50" rx="15" fill="url(#body5)"/>
  
  <!-- Arms -->
  <rect x="35" y="65" width="20" height="40" rx="10" fill="#7AB8FF"/>
  <rect x="145" y="65" width="20" height="40" rx="10" fill="#7AB8FF"/>
  
  <!-- Legs -->
  <rect x="75" y="100" width="15" height="15" rx="5" fill="#7AB8FF"/>
  <rect x="110" y="100" width="15" height="15" rx="5" fill="#7AB8FF"/>
</svg>
