<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Robot Cat 4 - Cool with raised eyebrow -->
  <defs>
    <linearGradient id="body4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5799;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <rect x="50" y="50" width="100" height="80" rx="20" fill="url(#body4)"/>
  
  <!-- Eyes (one raised eyebrow) -->
  <circle cx="75" cy="85" r="10" fill="white"/>
  <circle cx="125" cy="85" r="10" fill="white"/>
  <circle cx="75" cy="85" r="5" fill="#333"/>
  <circle cx="125" cy="85" r="5" fill="#333"/>
  
  <!-- Raised eyebrow -->
  <line x1="65" y1="70" x2="85" y2="65" stroke="#333" stroke-width="3"/>
  <line x1="115" y1="75" x2="135" y2="75" stroke="#333" stroke-width="3"/>
  
  <!-- Ears -->
  <polygon points="50,60 30,40 55,55" fill="#4A90E2"/>
  <polygon points="150,60 170,40 145,55" fill="#4A90E2"/>
  
  <!-- Smirk -->
  <path d="M 90 108 Q 100 115 115 108" stroke="white" stroke-width="3" fill="none"/>
  
  <!-- Body -->
  <rect x="60" y="130" width="80" height="50" rx="15" fill="url(#body4)"/>
  
  <!-- Arms -->
  <rect x="35" y="135" width="20" height="40" rx="10" fill="#4A90E2"/>
  <rect x="145" y="135" width="20" height="40" rx="10" fill="#4A90E2"/>
  
  <!-- Legs -->
  <rect x="75" y="175" width="15" height="15" rx="5" fill="#4A90E2"/>
  <rect x="110" y="175" width="15" height="15" rx="5" fill="#4A90E2"/>
</svg>
